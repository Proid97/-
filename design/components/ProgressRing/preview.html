<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProgressRing — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
html,body{margin:0}
body{background:var(--surface-page);color:var(--ink-primary);font-family:var(--font-sans);word-break:keep-all;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.ic{flex:none;display:block}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.focus{outline:2px solid var(--focus-ring);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.anat{--s:var(--subject-anatomy);--s-ink:var(--subject-anatomy-ink);--s-soft:var(--subject-anatomy-soft)}
.dev{--s:var(--subject-development);--s-ink:var(--subject-development-ink);--s-soft:var(--subject-development-soft)}
.dis{--s:var(--subject-disorders);--s-ink:var(--subject-disorders-ink);--s-soft:var(--subject-disorders-soft)}.lbl-sm{font-size:13px;line-height:18px;color:var(--ink-tertiary);margin-bottom:var(--space-2)}
.wrap{padding:var(--space-4);display:flex;gap:var(--space-8);align-items:flex-end;flex-wrap:wrap}
.item{display:flex;flex-direction:column;align-items:center;gap:var(--space-2)}
.ring{position:relative;margin:0}
.ring svg{display:block}
.ring circle{fill:none}
.ring .track{stroke:var(--border-subtle)}
.ring .val{stroke:var(--s);stroke-linecap:round;transition:stroke-dasharray 400ms cubic-bezier(.2,0,0,1)}
.ring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;color:var(--s-ink);font-variant-numeric:tabular-nums}
.ring .v small{font-size:.6em;font-weight:500;margin-left:1px}
.cap{font-size:13px;line-height:18px;color:var(--ink-tertiary)}
</style>
</head>
<body>
<div class="wrap">
<div class="item"><figure class="ring anat" style="width:48px;height:48px" role="img" aria-label="언어기관해부생리 진도 64퍼센트"><svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true"><circle class="track" cx="24.0" cy="24.0" r="21.5" stroke-width="5"/><circle class="val" cx="24.0" cy="24.0" r="21.5" stroke-width="5" pathLength="100" stroke-dasharray="64 100" transform="rotate(-90 24.0 24.0)"/></svg><span class="v" style="font-size:13px">64<small>%</small></span></figure><span class="cap">작게 48 · 목록</span></div>
<div class="item"><figure class="ring dev" style="width:72px;height:72px" role="img" aria-label="언어발달 진도 38퍼센트"><svg viewBox="0 0 72 72" width="72" height="72" aria-hidden="true"><circle class="track" cx="36.0" cy="36.0" r="33.0" stroke-width="6"/><circle class="val" cx="36.0" cy="36.0" r="33.0" stroke-width="6" pathLength="100" stroke-dasharray="38 100" transform="rotate(-90 36.0 36.0)"/></svg><span class="v" style="font-size:17px">38<small>%</small></span></figure><span class="cap">기본 72 · 카드</span></div>
<div class="item"><figure class="ring dis" style="width:112px;height:112px" role="img" aria-label="의사소통장애개론 진도 12퍼센트"><svg viewBox="0 0 112 112" width="112" height="112" aria-hidden="true"><circle class="track" cx="56.0" cy="56.0" r="52.0" stroke-width="8"/><circle class="val" cx="56.0" cy="56.0" r="52.0" stroke-width="8" pathLength="100" stroke-dasharray="12 100" transform="rotate(-90 56.0 56.0)"/></svg><span class="v" style="font-size:28px">12<small>%</small></span></figure><span class="cap">크게 112 · 과목 화면</span></div>
</div>
</body>
</html>
