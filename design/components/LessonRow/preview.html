<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LessonRow — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
html,body{margin:0}
body{background:var(--surface-page);color:var(--ink-primary);font-family:var(--font-sans);word-break:keep-all;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.ic{flex:none;display:block}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.focus{outline:2px solid var(--focus-ring);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.anat{--s:var(--subject-anatomy);--s-ink:var(--subject-anatomy-ink);--s-soft:var(--subject-anatomy-soft)}
.dev{--s:var(--subject-development);--s-ink:var(--subject-development-ink);--s-soft:var(--subject-development-soft)}
.dis{--s:var(--subject-disorders);--s-ink:var(--subject-disorders-ink);--s-soft:var(--subject-disorders-soft)}.group{background:var(--surface-card);border-radius:var(--radius-md);border:1px solid var(--border-subtle);overflow:hidden}
.row{display:flex;align-items:center;gap:var(--space-3);min-height:64px;padding:var(--space-3) var(--space-4);color:inherit;text-decoration:none}
.row + .row{border-top:1px solid var(--border-subtle)}
.row .no{flex:none;width:40px;height:40px;border-radius:var(--radius-sm);background:var(--s-soft);color:var(--s-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:15px}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-size:17px;line-height:22px;font-weight:600}
.row .m{font-size:13px;line-height:18px;color:var(--ink-tertiary);display:flex;align-items:center;gap:var(--space-1)}
.row .st{flex:none;display:flex;align-items:center;gap:var(--space-1);font-size:13px;line-height:18px;color:var(--ink-secondary)}
.row .st.reading{color:var(--s-ink);font-weight:600}
.row .chev{color:var(--ink-tertiary)}
.row.done .t{color:var(--ink-secondary)}.wrap{padding:var(--space-4);max-width:560px}
</style>
</head>
<body>
<div class="wrap"><div class="group anat">
<a class="row done" href="#"><span class="no">01</span><span class="txt"><span class="t">언어기관의 개관</span><span class="m">읽는 시간 8분 · 그림 4</span></span><span class="st"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>읽음</span><span class="chev"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></span></a>
<a class="row" href="#"><span class="no">02</span><span class="txt"><span class="t">호흡 기관과 호흡 근육</span><span class="m">읽는 시간 12분 · 그림 6</span></span><span class="st reading">40% 읽는 중</span><span class="chev"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></span></a>
<a class="row" href="#"><span class="no">03</span><span class="txt"><span class="t">후두의 구조: 연골과 관절</span><span class="m">읽는 시간 10분 · 그림 5</span></span><span class="st">안 읽음</span><span class="chev"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></span></a>
<a class="row" href="#"><span class="no">04</span><span class="txt"><span class="t">성대 진동과 발성 이론</span><span class="m">읽는 시간 9분 · 그림 3</span></span><span class="st">안 읽음</span><span class="chev"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></span></a>
</div></div>
</body>
</html>
