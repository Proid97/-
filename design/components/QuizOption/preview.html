<!-- @dsCard group="Quiz" height=400 subtitle="기본 · 선택 · 정답 · 오답" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizOption — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
html,body{margin:0}
body{background:var(--surface-page);color:var(--ink-primary);font-family:var(--font-sans);word-break:keep-all;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.ic{flex:none;display:block}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.focus{outline:2px solid var(--focus-ring);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.q{font-size:17px;line-height:24px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:var(--space-3)}
.opt{display:flex;align-items:center;gap:var(--space-3);min-height:56px;padding:var(--space-3) var(--space-4);background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-md);font-size:17px;line-height:24px;color:var(--ink-primary);text-align:left;width:100%;font-family:inherit;transition:background-color 150ms cubic-bezier(.2,0,0,1),border-color 150ms cubic-bezier(.2,0,0,1)}
.opt .n{flex:none;width:28px;height:28px;border-radius:var(--radius-pill);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:15px;font-weight:500;color:var(--ink-secondary)}
.opt .lab{flex:1}
.opt .res{flex:none;display:flex;align-items:center;gap:var(--space-1);font-size:15px;line-height:20px;font-weight:600}
.opt.selected{background:var(--accent-soft);border:2px solid var(--accent);padding:calc(var(--space-3) - 1px) calc(var(--space-4) - 1px)}
.opt.selected .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.correct{background:var(--correct-soft);border:2px solid var(--correct);padding:calc(var(--space-3) - 1px) calc(var(--space-4) - 1px)}
.opt.correct .n{border-color:var(--correct);color:var(--correct-ink)}
.opt.correct .res{color:var(--correct-ink)}
.opt.incorrect{background:var(--incorrect-soft);border:2px solid var(--incorrect);padding:calc(var(--space-3) - 1px) calc(var(--space-4) - 1px)}
.opt.incorrect .n{border-color:var(--incorrect);color:var(--incorrect-ink)}
.opt.incorrect .res{color:var(--incorrect-ink)}
.opt.dim{color:var(--ink-secondary)}.lbl-sm{font-size:13px;line-height:18px;color:var(--ink-tertiary);margin-bottom:var(--space-2)}
.wrap{padding:var(--space-4);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-6)}
.col{display:flex;flex-direction:column;gap:var(--space-3)}
</style>
</head>
<body>
<div class="wrap">
<div class="col"><p class="lbl-sm">선택 중 (기본 · 선택)</p>
<p class="q">후두의 연골 중 유일하게 완전한 고리 모양인 것은?</p>
<div class="opts"><button class="opt "><span class="n">1</span><span class="lab">갑상연골</span></button><button class="opt selected" aria-pressed="true"><span class="n">2</span><span class="lab">윤상연골</span></button><button class="opt "><span class="n">3</span><span class="lab">피열연골</span></button><button class="opt "><span class="n">4</span><span class="lab">후두개연골</span></button></div></div>
<div class="col"><p class="lbl-sm">채점 후 (정답 · 오답)</p>
<p class="q">후두의 연골 중 유일하게 완전한 고리 모양인 것은?</p>
<div class="opts"><button class="opt incorrect"><span class="n">1</span><span class="lab">갑상연골</span><span class="res"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/></svg>오답</span></button><button class="opt correct"><span class="n">2</span><span class="lab">윤상연골</span><span class="res"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.8 2.8L16.2 9.8"/></svg>정답</span></button><button class="opt dim"><span class="n">3</span><span class="lab">피열연골</span></button><button class="opt dim"><span class="n">4</span><span class="lab">후두개연골</span></button></div></div>
</div>
</body>
</html>
