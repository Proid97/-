<!-- @dsCard group="Screens" height=780 width=390 subtitle="iPhone 모의고사 문항 화면" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreenExam — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
html,body{margin:0}
body{background:var(--surface-page);color:var(--ink-primary);font-family:var(--font-sans);word-break:keep-all;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.ic{flex:none;display:block}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.focus{outline:2px solid var(--focus-ring);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.btn{font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--tap-min);padding:0 var(--space-4);border-radius:var(--radius-md);border:1px solid transparent;cursor:pointer;font-size:17px;line-height:22px;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:var(--surface-card);color:var(--accent-ink);border-color:var(--border-strong)}
.btn-quiet{background:transparent;color:var(--accent-ink)}
.btn-lg{min-height:50px;padding:0 var(--space-6);border-radius:var(--radius-md)}
.btn-sm{min-height:32px;padding:0 var(--space-3);font-size:15px;line-height:20px;border-radius:var(--radius-sm)}
.btn-block{display:flex;width:100%}
.btn[disabled]{background:var(--border-subtle);color:var(--ink-tertiary);border-color:transparent;cursor:not-allowed}
.btn-quiet[disabled]{background:transparent}.xbar{display:flex;align-items:center;gap:var(--space-3);min-height:56px;padding:var(--space-2) var(--space-4);background:var(--surface-elevated);box-shadow:var(--shadow-sheet)}
.xbar .time{display:flex;align-items:center;gap:var(--space-2);color:var(--ink-primary);padding:var(--space-1) var(--space-3) var(--space-1) var(--space-2);border-radius:var(--radius-pill);min-height:36px}
.xbar .time .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:20px;line-height:24px;font-weight:500}
.xbar .time .w{font-size:13px;line-height:18px;font-weight:600}
.xbar .count{flex:1;text-align:center;font-family:var(--font-mono);font-size:15px;line-height:20px;font-weight:500;color:var(--ink-secondary)}
.xbar .count b{color:var(--ink-primary);font-weight:600}
.xbar.warn .time{background:var(--warning-soft);color:var(--warning-ink)}
.xprog{height:3px;background:var(--border-subtle)}
.xprog i{display:block;height:100%;background:var(--accent)}.q{font-size:17px;line-height:24px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:var(--space-3)}
.opt{display:flex;align-items:center;gap:var(--space-3);min-height:56px;padding:var(--space-3) var(--space-4);background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-md);font-size:17px;line-height:24px;color:var(--ink-primary);text-align:left;width:100%;font-family:inherit;transition:background-color 150ms cubic-bezier(.2,0,0,1),border-color 150ms cubic-bezier(.2,0,0,1)}
.opt .n{flex:none;width:28px;height:28px;border-radius:var(--radius-pill);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:15px;font-weight:500;color:var(--ink-secondary)}
.opt .lab{flex:1}
.opt .res{flex:none;display:flex;align-items:center;gap:var(--space-1);font-size:15px;line-height:20px;font-weight:600}
.opt.selected{background:var(--accent-soft);border:2px solid var(--accent);padding:calc(var(--space-3) - 1px) calc(var(--space-4) - 1px)}
.opt.selected .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.correct{background:var(--correct-soft);border:2px solid var(--correct);padding:calc(var(--space-3) - 1px) calc(var(--space-4) - 1px)}
.opt.correct .n{border-color:var(--correct);color:var(--correct-ink)}
.opt.correct .res{color:var(--correct-ink)}
.opt.incorrect{background:var(--incorrect-soft);border:2px solid var(--incorrect);padding:calc(var(--space-3) - 1px) calc(var(--space-4) - 1px)}
.opt.incorrect .n{border-color:var(--incorrect);color:var(--incorrect-ink)}
.opt.incorrect .res{color:var(--incorrect-ink)}
.opt.dim{color:var(--ink-secondary)}.phone{width:390px;margin:0 auto;background:var(--surface-page);display:flex;flex-direction:column;min-height:100%;position:relative}
.sbar{height:47px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 var(--space-6) var(--space-2) 32px;font-size:15px;line-height:20px;font-weight:600}
.sbar .dots{display:flex;gap:var(--space-1)}
.sbar .dots i{width:18px;height:10px;border-radius:3px;background:var(--ink-primary);opacity:.85}
.phone{min-height:780px}
.body{flex:1;padding:var(--space-6) var(--space-4);display:flex;flex-direction:column;gap:var(--space-4)}
.qh{display:flex;justify-content:space-between;align-items:center}
.qh .no{font-size:15px;line-height:20px;font-weight:500;color:var(--ink-secondary)}
.qh .tag{font-size:13px;line-height:18px;color:var(--ink-tertiary)}
.q{font-size:17px;line-height:24px}
.foot{display:flex;gap:var(--space-3);padding:var(--space-3) var(--space-4) 34px;background:var(--surface-elevated);border-top:1px solid var(--border-subtle)}
.foot .btn{flex:1}
</style>
</head>
<body>
<div class="phone"><div class="sbar" aria-hidden="true"><span class="mono">9:41</span><span class="dots"><i></i><i></i></span></div>
<div><div class="xbar"><span class="time" role="timer" aria-label="남은 시간 24:37"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg><span class="v">24:37</span></span><span class="count" aria-label="40문항 중 17번"><b>17</b> / 40</span><button class="btn btn-primary btn-sm" style="min-height:var(--tap-min)">제출</button></div><div class="xprog"><i style="width:42%"></i></div></div>
<main class="body">
<div class="qh"><span class="no">문항 <span class="mono">17</span></span><button class="btn btn-quiet btn-sm" style="min-height:var(--tap-min)"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 20.5V4M6 4.5h11l-2.2 3.7L17 12H6"/></svg>나중에 보기</button></div>
<p class="tag">언어기관해부생리 · 후두</p>
<p class="q">성대를 길게 늘여 음높이를 높이는 데 가장 크게 관여하는 근육은?</p>
<div class="opts"><button class="opt "><span class="n">1</span><span class="lab">갑상피열근</span></button><button class="opt "><span class="n">2</span><span class="lab">후윤상피열근</span></button><button class="opt selected" aria-pressed="true"><span class="n">3</span><span class="lab">윤상갑상근</span></button><button class="opt "><span class="n">4</span><span class="lab">외측윤상피열근</span></button></div>
</main>
<div class="foot"><button class="btn btn-secondary"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>이전</button><button class="btn btn-primary">다음<svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button></div>
</div>
</body>
</html>
