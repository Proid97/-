<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TabBar — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
html,body{margin:0}
body{background:var(--surface-page);color:var(--ink-primary);font-family:var(--font-sans);word-break:keep-all;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.ic{flex:none;display:block}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.focus{outline:2px solid var(--focus-ring);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.tabbar{display:flex;background:var(--surface-elevated);border-top:1px solid var(--border-subtle);padding-bottom:34px;position:relative}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tabbar-height);color:var(--ink-secondary);text-decoration:none;font-size:11px;line-height:13px}
.tabbar a .lbl{font-size:13px;line-height:16px}
.tabbar a[aria-current="page"]{color:var(--accent-ink)}
.tabbar a[aria-current="page"] .lbl{font-weight:600}
.tabbar .home-ind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:var(--radius-pill);background:var(--ink-primary)}
.wrap{max-width:390px;margin:var(--space-4) auto 0;border-radius:var(--radius-md) var(--radius-md) 0 0;overflow:hidden;border:1px solid var(--border-subtle);border-bottom:0}
</style>
</head>
<body>
<div class="wrap"><nav class="tabbar" aria-label="탭"><a href="#" aria-current="page"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5.5v-6h-5v6H4z"/></svg><span class="lbl">홈</span></a><a href="#"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5c2.6-1 5.4-1 8 .6 2.6-1.6 5.4-1.6 8-.6V19c-2.6-1-5.4-1-8 .6-2.6-1.6-5.4-1.6-8-.6z"/><path d="M12 6.1v13.5"/></svg><span class="lbl">학습</span></a><a href="#"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5V8h4M9.5 12h6M9.5 15.5h6"/></svg><span class="lbl">모의고사</span></a><a href="#"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 19.5V12M12 19.5V5.5M18 19.5V14M3.5 19.5h17"/></svg><span class="lbl">내 기록</span></a><span class="home-ind" aria-hidden="true"></span></nav></div>
</body>
</html>
