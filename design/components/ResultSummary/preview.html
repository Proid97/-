<!-- @dsCard group="Exam" height=560 subtitle="점수 · 정답/오답 수 · 주제별 막대 · 오답 복습" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResultSummary — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
html,body{margin:0}
body{background:var(--surface-page);color:var(--ink-primary);font-family:var(--font-sans);word-break:keep-all;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.ic{flex:none;display:block}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.focus{outline:2px solid var(--focus-ring);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.btn{font:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:var(--tap-min);padding:0 var(--space-4);border-radius:var(--radius-md);border:1px solid transparent;cursor:pointer;font-size:17px;line-height:22px;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:var(--surface-card);color:var(--accent-ink);border-color:var(--border-strong)}
.btn-quiet{background:transparent;color:var(--accent-ink)}
.btn-lg{min-height:50px;padding:0 var(--space-6);border-radius:var(--radius-md)}
.btn-sm{min-height:32px;padding:0 var(--space-3);font-size:15px;line-height:20px;border-radius:var(--radius-sm)}
.btn-block{display:flex;width:100%}
.btn[disabled]{background:var(--border-subtle);color:var(--ink-tertiary);border-color:transparent;cursor:not-allowed}
.btn-quiet[disabled]{background:transparent}.anat{--s:var(--subject-anatomy);--s-ink:var(--subject-anatomy-ink);--s-soft:var(--subject-anatomy-soft)}
.dev{--s:var(--subject-development);--s-ink:var(--subject-development-ink);--s-soft:var(--subject-development-soft)}
.dis{--s:var(--subject-disorders);--s-ink:var(--subject-disorders-ink);--s-soft:var(--subject-disorders-soft)}.scard{background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);overflow:hidden;display:flex;flex-direction:column}
.scard .strip{height:6px;background:var(--s)}
.scard .in{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);flex:1}
.scard .tag{align-self:flex-start;font-size:13px;line-height:18px;font-weight:600;color:var(--s-ink);background:var(--s-soft);padding:2px var(--space-2);border-radius:var(--radius-sm)}
.scard .name{font-size:17px;line-height:22px;font-weight:600}
.scard .meta{font-size:13px;line-height:18px;color:var(--ink-tertiary)}
.bar{height:6px;border-radius:var(--radius-pill);background:var(--border-subtle);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--s)}
.scard .prog{display:flex;align-items:center;gap:var(--space-3)}
.scard .prog .bar{flex:1}
.scard .pct{font-family:var(--font-mono);font-size:15px;line-height:20px;font-weight:500;color:var(--s-ink);min-width:3.2em;text-align:right}.res{background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-6)}
.res .k{font-size:13px;line-height:18px;color:var(--ink-tertiary)}
.res .sc{display:flex;align-items:baseline;gap:var(--space-1);margin-top:var(--space-1)}
.res .sc .n{font-family:var(--font-mono);font-size:56px;line-height:60px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.res .sc .u{font-size:22px;line-height:28px;font-weight:600}
.res .delta{font-size:15px;line-height:20px;color:var(--ink-secondary);margin-top:var(--space-1)}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.cnt div{border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);display:flex;align-items:center;gap:var(--space-2);font-size:15px;line-height:20px;font-weight:600}
.cnt .ok{background:var(--correct-soft);color:var(--correct-ink)}
.cnt .no{background:var(--incorrect-soft);color:var(--incorrect-ink)}
.cnt b{margin-left:auto;font-family:var(--font-mono);font-size:20px;line-height:24px;font-weight:600}
.topics{display:flex;flex-direction:column;gap:var(--space-3)}
.topics h3{font-size:17px;line-height:22px;font-weight:600}
.tp{display:grid;grid-template-columns:7.5em 1fr 3em;align-items:center;gap:var(--space-3);font-size:15px;line-height:20px}
.tp .p{font-family:var(--font-mono);font-weight:500;text-align:right;color:var(--ink-secondary)}
.tp .bar{height:8px}
.tp .lw{grid-column:1/-1;margin-top:calc(var(--space-2) * -1);font-size:13px;line-height:18px;color:var(--warning-ink);display:flex;align-items:center;gap:var(--space-1);font-weight:600}.wrap{padding:var(--space-4);max-width:420px}
</style>
</head>
<body>
<div class="wrap"><section class="res dev" aria-label="모의고사 결과">
<div><p class="k">언어발달 · 모의고사 2회 · 소요 38분 12초</p>
<div class="sc"><span class="n">84</span><span class="u">점</span></div>
<p class="delta">40문항 중 34문항 정답 · 지난번보다 8점 올랐어요.</p></div>
<div class="cnt"><div class="ok"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.8 2.8L16.2 9.8"/></svg>정답<b>34</b></div><div class="no"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/></svg>오답<b>6</b></div></div>
<div class="topics"><h3>주제별 정답률</h3><div class="tp"><span>음운 발달</span><div class="bar" role="progressbar" aria-label="음운 발달 정답률" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100"><i style="width:90%"></i></div><span class="p">90%</span></div><div class="tp"><span>형태·구문 발달</span><div class="bar" role="progressbar" aria-label="형태·구문 발달 정답률" aria-valuenow="85" aria-valuemin="0" aria-valuemax="100"><i style="width:85%"></i></div><span class="p">85%</span></div><div class="tp"><span>의미 발달</span><div class="bar" role="progressbar" aria-label="의미 발달 정답률" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"><i style="width:80%"></i></div><span class="p">80%</span></div><div class="tp"><span>화용 발달</span><div class="bar" role="progressbar" aria-label="화용 발달 정답률" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"><i style="width:50%"></i></div><span class="p">50%</span><span class="lw"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><circle cx="12" cy="16.3" r=".4"/></svg>보충 필요 · 오답 3문항</span></div></div>
<button class="btn btn-primary btn-lg btn-block">오답 6문항 복습</button>
</section></div>
</body>
</html>
