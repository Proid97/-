<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreenHome — 미리보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
html,body{margin:0}
body{background:var(--surface-page);color:var(--ink-primary);font-family:var(--font-sans);word-break:keep-all;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
p,h1,h2,h3{margin:0}
.ic{flex:none;display:block}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.focus{outline:2px solid var(--focus-ring);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.anat{--s:var(--subject-anatomy);--s-ink:var(--subject-anatomy-ink);--s-soft:var(--subject-anatomy-soft)}
.dev{--s:var(--subject-development);--s-ink:var(--subject-development-ink);--s-soft:var(--subject-development-soft)}
.dis{--s:var(--subject-disorders);--s-ink:var(--subject-disorders-ink);--s-soft:var(--subject-disorders-soft)}.scard{background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);overflow:hidden;display:flex;flex-direction:column}
.scard .strip{height:6px;background:var(--s)}
.scard .in{padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);flex:1}
.scard .tag{align-self:flex-start;font-size:13px;line-height:18px;font-weight:600;color:var(--s-ink);background:var(--s-soft);padding:2px var(--space-2);border-radius:var(--radius-sm)}
.scard .name{font-size:17px;line-height:22px;font-weight:600}
.scard .meta{font-size:13px;line-height:18px;color:var(--ink-tertiary)}
.bar{height:6px;border-radius:var(--radius-pill);background:var(--border-subtle);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--radius-pill);background:var(--s)}
.scard .prog{display:flex;align-items:center;gap:var(--space-3)}
.scard .prog .bar{flex:1}
.scard .pct{font-family:var(--font-mono);font-size:15px;line-height:20px;font-weight:500;color:var(--s-ink);min-width:3.2em;text-align:right}.tabbar{display:flex;background:var(--surface-elevated);border-top:1px solid var(--border-subtle);padding-bottom:34px;position:relative}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tabbar-height);color:var(--ink-secondary);text-decoration:none;font-size:11px;line-height:13px}
.tabbar a .lbl{font-size:13px;line-height:16px}
.tabbar a[aria-current="page"]{color:var(--accent-ink)}
.tabbar a[aria-current="page"] .lbl{font-weight:600}
.tabbar .home-ind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:var(--radius-pill);background:var(--ink-primary)}.phone{width:390px;margin:0 auto;background:var(--surface-page);display:flex;flex-direction:column;min-height:100%;position:relative}
.sbar{height:47px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 var(--space-6) var(--space-2) 32px;font-size:15px;line-height:20px;font-weight:600}
.sbar .dots{display:flex;gap:var(--space-1)}
.sbar .dots i{width:18px;height:10px;border-radius:3px;background:var(--ink-primary);opacity:.85}
.body{flex:1;padding:var(--space-2) var(--space-4) var(--space-6);display:flex;flex-direction:column;gap:var(--space-6)}
.hi .d{font-size:15px;line-height:20px;color:var(--ink-secondary)}
.hi h1{font-size:34px;line-height:41px;font-weight:700;margin-top:var(--space-1)}
.goal{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.goal .top{display:flex;justify-content:space-between;align-items:baseline}
.goal .l{font-size:17px;line-height:22px;font-weight:600}
.goal .v{font-family:var(--font-mono);font-size:15px;line-height:20px;font-weight:500;color:var(--accent-ink)}
.goal .bar i{background:var(--accent)}
.goal .s{font-size:13px;line-height:18px;color:var(--ink-tertiary)}
.sec{display:flex;flex-direction:column;gap:var(--space-3)}
.sec h2{font-size:22px;line-height:28px;font-weight:600}
.scard .in{gap:var(--space-2)}
</style>
</head>
<body>
<div class="phone"><div class="sbar" aria-hidden="true"><span class="mono">9:41</span><span class="dots"><i></i><i></i></span></div>
<main class="body">
<div class="hi"><p class="d">10월 10일 토요일</p><h1>오늘도 한 단원씩</h1></div>
<section class="goal" aria-label="오늘의 목표"><div class="top"><span class="l">오늘의 목표 · 퀴즈 20문항</span><span class="v">12 / 20</span></div>
<div class="bar" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"><i style="width:60%"></i></div>
<p class="s">8문항 남았어요. 언어발달 4장 퀴즈로 이어서 풀 수 있어요.</p></section>
<section class="sec"><h2>과목</h2><article class="scard anat"><div class="strip"></div><div class="in"><span class="tag">12챕터</span><h3 class="name">언어기관해부생리</h3><p class="meta">다음: 3장 후두의 구조 · 10분</p><div class="prog"><div class="bar" role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" aria-label="진도"><i style="width:64%"></i></div><span class="pct">64%</span></div></div></article><article class="scard dev"><div class="strip"></div><div class="in"><span class="tag">10챕터</span><h3 class="name">언어발달</h3><p class="meta">다음: 4장 음운 발달 단계 · 12분</p><div class="prog"><div class="bar" role="progressbar" aria-valuenow="38" aria-valuemin="0" aria-valuemax="100" aria-label="진도"><i style="width:38%"></i></div><span class="pct">38%</span></div></div></article><article class="scard dis"><div class="strip"></div><div class="in"><span class="tag">14챕터</span><h3 class="name">의사소통장애개론</h3><p class="meta">다음: 2장 실어증의 분류 · 9분</p><div class="prog"><div class="bar" role="progressbar" aria-valuenow="12" aria-valuemin="0" aria-valuemax="100" aria-label="진도"><i style="width:12%"></i></div><span class="pct">12%</span></div></div></article></section>
</main>
<nav class="tabbar" aria-label="탭"><a href="#" aria-current="page"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5.5v-6h-5v6H4z"/></svg><span class="lbl">홈</span></a><a href="#"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5c2.6-1 5.4-1 8 .6 2.6-1.6 5.4-1.6 8-.6V19c-2.6-1-5.4-1-8 .6-2.6-1.6-5.4-1.6-8-.6z"/><path d="M12 6.1v13.5"/></svg><span class="lbl">학습</span></a><a href="#"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5V8h4M9.5 12h6M9.5 15.5h6"/></svg><span class="lbl">모의고사</span></a><a href="#"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 19.5V12M12 19.5V5.5M18 19.5V14M3.5 19.5h17"/></svg><span class="lbl">내 기록</span></a><span class="home-ind" aria-hidden="true"></span></nav>
</div>
</body>
</html>
